<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signup Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=Instrument+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #151518;
      --border: #2a2a30;
      --border-focus: #7c6af7;
      --border-error: #e05a5a;
      --accent: #7c6af7;
      --accent-glow: rgba(124,106,247,0.25);
      --text: #f0eff8;
      --muted: #74747f;
      --error-text: #e05a5a;
      --success: #5ae0a0;
    }

    body {
        background-color: #3a3a44;
        text-align: center;
        justify-content: center;
        align-items: center;
        display: flex;
        height: 100vh;
        background-image: radial-gradient(circle at 20% 20%, rgba(124,106,247,0.12) 0%, transparent 70%), radial-gradient(circle at 80% 80%, rgba(90,224,160,0.07) 0%, transparent 70%);
      
    }

    body::before {
      content: '';
      position: fixed;
      top: -30%;
      right: -20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(124,106,247,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(90,224,160,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      position: relative;
      z-index: 1;
      box-shadow: 0 0 60px rgba(0,0,0,0.4);
    }

    .card-header {
      margin-bottom: 2.5rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(124,106,247,0.12);
      border: 1px solid rgba(124,106,247,0.25);
      border-radius: 999px;
      padding: 0.3rem 0.85rem;
      margin-bottom: 1.1rem;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      margin-top: 0.5rem;
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .field {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 0.45rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      background: #101013;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.8rem 1rem;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder { color: #3a3a44; }

    input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    input.error {
      border-color: var(--border-error) !important;
      box-shadow: 0 0 0 3px rgba(224, 90, 90, 0.15) !important;
    }

    .error-msg {
      display: block;
      font-size: 0.78rem;
      color: var(--error-text);
      margin-top: 0.4rem;
      min-height: 1rem;
      font-style: italic;
    }

    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .checkbox-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .checkbox-row label {
      text-transform: none;
      letter-spacing: 0;
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0;
      line-height: 1.5;
    }

    .checkbox-row label a {
      color: var(--accent);
      text-decoration: none;
    }

    .checkbox-row label a:hover { text-decoration: underline; }

    .terms-error {
      display: block;
      font-size: 0.78rem;
      color: var(--error-text);
      margin-top: 0.3rem;
      font-style: italic;
      min-height: 1rem;
    }

    .btn-submit {
      width: 100%;
      padding: 0.9rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(124,106,247,0.3);
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(124,106,247,0.4);
    }

    .btn-submit:active { transform: translateY(0); }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0 1.5rem;
    }

    .resend-section {
      text-align: center;
    }

    .resend-section p {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 0.85rem;
    }

    #resendBtn {
      padding: 0.65rem 1.6rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.85rem;
      cursor: not-allowed;
      transition: all 0.25s;
    }

    #resendBtn:not(:disabled) {
      border-color: var(--success);
      color: var(--success);
      cursor: pointer;
      box-shadow: 0 0 12px rgba(90,224,160,0.15);
    }

    #resendBtn:not(:disabled):hover {
      background: rgba(90,224,160,0.08);
    }

    .success-banner {
      display: none;
      background: rgba(90,224,160,0.08);
      border: 1px solid rgba(90,224,160,0.25);
      border-radius: 10px;
      padding: 0.9rem 1.1rem;
      text-align: center;
      color: var(--success);
      font-size: 0.88rem;
      margin-bottom: 1.5rem;
    }

    .success-banner.show { display: block; }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h1>Create your<br><span>account.</span></h1>
      <p class="subtitle">Fill in the details below to get started.</p>
    </div>

    <div id="successBanner" class="success-banner">
       Account created! Check your email for a verification link.
    </div>

    <form id="signupForm" novalidate>

      
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="e.g. innocent_sec" />
        <span class="error-msg" id="usernameError"></span>
      </div>

      
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" />
        <span class="error-msg" id="emailError"></span>
      </div>

      
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Min. 8 characters" />
        <span class="error-msg" id="passwordError"></span>
      </div>

      
      <div class="checkbox-row">
        <input type="checkbox" id="terms" />
        <label for="terms">
          I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
        </label>
      </div>
      <span class="error-msg terms-error" id="termsError"></span>

      <button type="submit" class="btn-submit">Create Account →</button>
    </form>

    <hr class="divider" />

    <div class="resend-section">
      <p>Didn't receive a verification email?</p>
      <button id="resendBtn" disabled>Resend in 15s</button>
    </div>
  </div>

  <script src="validation.js"></script>
  <script src="async.js"></script>
</body>
</html>
